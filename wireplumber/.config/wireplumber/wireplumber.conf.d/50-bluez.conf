# Bluetooth audio hygiene for reliable earbud mic use (dictation + calls).
#
# Strategy: always connect in A2DP (hi-fi playback), keep WirePlumber's
# autoswitch enabled so capturing from the persistent bluez_input node
# flips the card to HFP only while recording, then back to A2DP.

monitor.bluez.properties = {
  # Wideband speech (16 kHz mSBC) instead of 8 kHz CVSD - matters for STT accuracy
  bluez5.enable-msbc = true
  bluez5.enable-sbc-xq = true
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf ]
        # Land on A2DP at connect; autoswitch handles HFP on demand
        device.profile = "a2dp-sink"
      }
    }
  }
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        # Real Bluetooth mics must always outrank monitors in default-node election
        priority.session = 3000
      }
    }
  }
]
